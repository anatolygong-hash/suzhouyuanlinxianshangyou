<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移步换景 · 苏州园林志</title>
<meta name="description" content="苏州古典园林 · 漫步移步换景之间">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Liu+Jian+Mao+Cao&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{
  font-family:'Noto Serif SC','STSong','SimSun',serif;
  background:#f1e7cf;
  color:#1f1a14;
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
  line-height:1.7;
}
:root{
  --c-paper:#f3ead7;
  --c-paper-2:#e8dec3;
  --c-ink:#1a1410;
  --c-ink-soft:#3d3329;
  --c-vermilion:#b13a2f;
  --c-vermilion-deep:#872821;
  --c-daiqing:#2f5a6e;
  --c-daiqing-deep:#143442;
  --c-gold:#b58d4e;
  --c-copper:#a66a3d;
  --f-li:'Ma Shan Zheng','STXingkai',serif;
  --f-kai:'Noto Serif SC','STKaiti',serif;
  --f-xw:'ZCOOL XiaoWei',serif;
  --f-ljmc:'Liu Jian Mao Cao',serif;
  --f-latin:'Cormorant Garamond',serif;
}

/* ==== 背景纹理 ==== */
body::before{
  content:'';position:fixed;inset:0;z-index:1;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(139,90,60,0.06) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 80%, rgba(47,90,110,0.05) 0%, transparent 40%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;z-index:1;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(139,90,60,0.04) 0%, transparent 8%),
    radial-gradient(circle at 80% 70%, rgba(31,26,20,0.03) 0%, transparent 6%),
    repeating-linear-gradient(45deg, transparent 0, transparent 4px, rgba(139,90,60,0.012) 4px, rgba(139,90,60,0.012) 5px);
  pointer-events:none;mix-blend-mode:multiply;
}
#ripple-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;mix-blend-mode:multiply}

/* ==== 顶部导航 ==== */
.top-nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(241,231,207,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(31,26,20,0.25);
  padding:14px 32px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--f-kai);
}
.top-nav a.back{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--c-ink);text-decoration:none;
  font-size:14px;letter-spacing:0.2em;
  padding:6px 14px;
  border:1px solid rgba(31,26,20,0.3);
  background:var(--c-paper);
  transition:background .3s, color .3s;
}
.top-nav a.back:hover{background:var(--c-vermilion);color:var(--c-paper);border-color:var(--c-vermilion-deep)}
.top-nav a.back::before{content:'←';font-size:18px}
.top-nav .crumbs{
  display:flex;align-items:center;gap:14px;
  font-family:var(--f-kai);
  font-size:15px;letter-spacing:0.24em;
  color:var(--c-ink-soft);
}
.top-nav .crumbs .sep{opacity:0.4}
.top-nav .crumbs .cur{color:var(--c-vermilion-deep);font-family:var(--f-li);font-size:18px;letter-spacing:0.2em}
.top-nav .quick-nav{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
}
.top-nav .quick-nav a{
  display:inline-flex;align-items:center;justify-content:center;
  height:36px;padding:0 11px;
  font-family:var(--f-li);font-size:14px;line-height:1;
  white-space:nowrap;letter-spacing:0.05em;
  color:var(--c-ink);text-decoration:none;
  border:1px solid rgba(31,26,20,0.3);
  background:var(--c-paper);
  transition:all .3s;
}
.top-nav .quick-nav a:hover{background:var(--c-vermilion);color:var(--c-paper);transform:translateY(-2px);border-color:var(--c-vermilion-deep)}
.top-nav .quick-nav a.active{
  background:var(--c-vermilion);color:var(--c-paper);border-color:var(--c-vermilion-deep);
  box-shadow:0 2px 8px rgba(177,58,47,0.3);
}

/* ==== HERO ==== */
.hero{
  position:relative;height:100vh;min-height:640px;
  overflow:hidden;
  display:flex;align-items:flex-end;
  z-index:3;
}
.hero-img{
  position:absolute;inset:0;z-index:0;
  overflow:hidden;
  filter:saturate(0.85) contrast(1.08) sepia(0.12) brightness(0.85);
  transform:scale(1.05);
  animation:slowZoom 18s ease-in-out infinite alternate;
}
.hero-img svg{display:block;width:100%;height:100%;position:relative;z-index:1}
.hero-img img{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover;z-index:2}
.hero-img .svg-fallback{position:absolute;inset:0;z-index:1}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.08)}}
.hero::after{
  content:'';position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg, rgba(31,26,20,0.4) 0%, rgba(31,26,20,0.15) 40%, rgba(31,26,20,0.85) 100%),
    linear-gradient(90deg, rgba(31,26,20,0.5) 0%, transparent 50%);
}
.hero-frame{
  position:absolute;inset:18px;z-index:3;
  border:1px solid rgba(243,234,215,0.3);
  pointer-events:none;
}
.hero-frame::before,.hero-frame::after{
  content:'';position:absolute;width:30px;height:30px;border:2px solid var(--c-gold);
}
.hero-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.hero-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}

.hero-content{
  position:relative;z-index:4;
  width:100%;
  padding:0 60px 100px;
  color:var(--c-paper);
}
.hero-eyebrow{
  font-family:var(--f-kai);
  font-size:16px;letter-spacing:0.4em;
  color:var(--c-gold);
  margin-bottom:18px;
  display:flex;align-items:center;gap:14px;
  animation:fadeUp 1s .2s backwards ease-out;
}
.hero-eyebrow::before{
  content:'';display:inline-block;width:48px;height:1px;background:var(--c-gold);
}
.hero-title{
  font-family:var(--f-li);
  font-size:200px;
  line-height:0.9;
  letter-spacing:0.08em;
  font-weight:400;
  margin-bottom:14px;
  animation:fadeUp 1.2s .4s backwards ease-out;
}
.hero-py{
  font-family:var(--f-kai);
  font-size:20px;
  color:rgba(243,234,181,0.85);
  letter-spacing:0.22em;
  margin-bottom:30px;
  animation:fadeUp 1.2s .6s backwards ease-out;
}
.hero-verse{
  font-family:var(--f-kai);
  font-size:26px;
  letter-spacing:0.4em;
  line-height:1.8;
  color:var(--c-paper);
  padding-left:18px;
  border-left:3px solid var(--c-vermilion);
  max-width:700px;
  animation:fadeUp 1.2s .8s backwards ease-out;
}
.hero-verse .accent{font-family:var(--f-li);font-size:32px;color:var(--c-gold)}
.hero-tags{
  margin-top:30px;
  display:flex;gap:10px;flex-wrap:wrap;
  animation:fadeUp 1.2s 1s backwards ease-out;
}
.hero-tags span{
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.3em;
  padding:6px 16px;
  background:rgba(243,234,181,0.15);
  border:1px solid var(--c-gold);
  color:var(--c-gold);
  backdrop-filter:blur(4px);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.scroll-hint{
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
  z-index:5;color:var(--c-paper);
  text-align:center;
  font-family:var(--f-kai);
  font-size:13px;letter-spacing:0.4em;
  animation:fadeUp 1.5s 1.5s backwards ease-out, bob 2s 2s infinite ease-in-out;
}
.scroll-hint .arrow{
  margin-top:6px;
  width:1px;height:30px;
  background:linear-gradient(180deg,transparent,var(--c-paper));
  margin-left:auto;margin-right:auto;
}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ==== 速览信息条 ==== */
.quick-info{
  position:relative;z-index:4;
  background:linear-gradient(180deg, var(--c-paper) 0%, var(--c-paper-2) 100%);
  border-bottom:1px solid rgba(31,26,20,0.3);
  padding:32px 0;
}
.quick-grid{
  display:grid;grid-template-columns:repeat(4, 1fr);
  text-align:center;
  position:relative;
}
.quick-grid::before,.quick-grid::after{
  content:'';position:absolute;top:0;bottom:0;width:1px;background:rgba(31,26,20,0.3);
}
.quick-grid::before{left:25%}
.quick-grid::after{right:25%}
.quick-item{padding:0 24px}
.quick-item .k{
  font-family:var(--f-kai);font-size:12px;letter-spacing:0.4em;
  color:var(--c-ink-soft);margin-bottom:8px;display:block;
}
.quick-item .v{
  font-family:var(--f-li);font-size:24px;letter-spacing:0.1em;
  color:var(--c-vermilion-deep);
}
.quick-item .en{
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.28em;
  color:var(--c-ink-soft);
  display:block;margin-top:4px;
}

/* ==== 通用分隔 ==== */
.section-divider{
  position:relative;z-index:3;
  padding:60px 0 30px;
  text-align:center;
}
.section-divider .ornament{
  display:flex;align-items:center;justify-content:center;gap:24px;
  font-family:var(--f-kai);letter-spacing:0.5em;
  color:var(--c-ink-soft);font-size:13px;
  margin-bottom:14px;
}
.section-divider .ornament .bar{display:inline-block;width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--c-ink-soft),transparent)}
.section-divider .ornament .diamond{width:8px;height:8px;background:var(--c-vermilion);transform:rotate(45deg)}
.section-divider h2{
  font-family:var(--f-li);font-size:74px;
  color:var(--c-ink);margin:0;letter-spacing:0.12em;
}
.section-divider h2 .en{
  display:block;
  font-family:var(--f-kai);font-size:16px;letter-spacing:0.3em;
  color:var(--c-vermilion-deep);font-weight:400;
  margin-bottom:14px;
}
.section-divider p{max-width:640px;margin:18px auto 0;font-family:var(--f-kai);font-size:15px;color:var(--c-ink-soft);line-height:2;letter-spacing:0.05em}

/* ==== 移步换景 主体 ==== */
.walker-section{
  position:relative;z-index:3;
  padding:30px 0 100px;
}
.walker{
  max-width:1400px;margin:0 auto;
  padding:0 32px;
}

/* 顶部游戏条 */
.game-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
  padding:18px 24px;
  background:var(--c-paper);
  border:1px solid rgba(31,26,20,0.3);
  position:relative;
}
.game-bar::before{
  content:'';position:absolute;inset:5px;
  border:1px solid rgba(31,26,20,0.15);
  pointer-events:none;
}
.game-bar .title{
  font-family:var(--f-li);font-size:24px;color:var(--c-ink);letter-spacing:0.2em;
}
.game-bar .progress{
  font-family:var(--f-kai);font-size:15px;letter-spacing:0.26em;
  color:var(--c-ink-soft);
}
.game-bar .progress .num{
  font-size:24px;color:var(--c-vermilion-deep);font-weight:500;margin:0 4px;
}
.game-bar .actions{
  display:flex;gap:10px;
}
.game-bar .actions button{
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.2em;
  padding:8px 18px;
  background:var(--c-paper-2);
  border:1px solid rgba(31,26,20,0.3);
  color:var(--c-ink);
  cursor:pointer;
  transition:all .3s;
}
.game-bar .actions button:hover{background:var(--c-vermilion);color:var(--c-paper);border-color:var(--c-vermilion-deep)}
.game-bar .actions button.active{background:var(--c-vermilion);color:var(--c-paper);border-color:var(--c-vermilion-deep)}

/* 进度条 */
.progress-bar{
  height:4px;
  background:rgba(31,26,20,0.15);
  margin-bottom:24px;
  position:relative;
  overflow:hidden;
}
.progress-bar::after{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:var(--progress, 0%);
  background:linear-gradient(90deg, var(--c-vermilion), var(--c-gold));
  transition:width .6s cubic-bezier(0.2,0.7,0.2,1);
}

/* 舞台 */
.stage{
  position:relative;
  height:64vh;
  min-height:480px;
  max-height:720px;
  background:#1a1410;
  overflow:hidden;
  border:1px solid rgba(31,26,20,0.4);
  box-shadow:
    0 30px 60px -20px rgba(31,26,20,0.5),
    inset 0 0 0 6px rgba(243,234,215,0.04);
}
.stage-frame{
  position:absolute;inset:18px;
  border:1px solid rgba(243,234,215,0.25);
  pointer-events:none;
  z-index:5;
}
/* 底部压暗：白字落在亮照片上也读得清（在信息层之下、照片之上） */
.stage::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:68%;
  background:linear-gradient(180deg,
    rgba(20,16,12,0) 0%,
    rgba(20,16,12,0.24) 40%,
    rgba(20,16,12,0.58) 74%,
    rgba(20,16,12,0.76) 100%);
  z-index:4;pointer-events:none;
}
.stage-frame::before,.stage-frame::after{
  content:'';position:absolute;width:20px;height:20px;border:2px solid var(--c-gold);
}
.stage-frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.stage-frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}

/* 落章：盖在画面上，照片全程留在屏上，章自行落定并淡出 */
.stamp-flash{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-15deg);
  width:120px;height:120px;
  background:#b13a2f;color:#f3ead7;
  font-family:var(--f-li);font-size:32px;
  display:flex;align-items:center;justify-content:center;
  border:3px solid #872821;
  box-shadow:0 0 0 6px rgba(177,58,47,.3);
  z-index:20;pointer-events:none;
  animation:stampPress 1.3s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes stampPress{
  0%{transform:translate(-50%,-50%) rotate(-15deg) scale(2);opacity:0}
  12%{transform:translate(-50%,-50%) rotate(-15deg) scale(.92);opacity:1}
  22%{transform:translate(-50%,-50%) rotate(-15deg) scale(1.04);opacity:1}
  30%{transform:translate(-50%,-50%) rotate(-15deg) scale(1);opacity:1}
  70%{transform:translate(-50%,-50%) rotate(-15deg) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) rotate(-15deg) scale(1);opacity:0}
}

.stage-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:opacity .45s ease;
}
.stage-bg svg{display:block;width:100%;height:100%}
.stage-bg.cur{
  opacity:1;
  filter:saturate(0.9) contrast(1.08) sepia(0.1);
}
.stage-bg.next{
  opacity:0;
}
.stage-bg.transitioning-out{animation:slideOut 1s forwards}
.stage-bg.transitioning-in{animation:slideIn 1s forwards}
@keyframes slideOut{
  from{transform:translateX(0);opacity:1}
  to{transform:translateX(-4%);opacity:0}
}
@keyframes slideIn{
  from{transform:translateX(4%);opacity:0}
  to{transform:translateX(0);opacity:1}
}

/* 角落印章 / 标题 */
.stage-overlay-tl{
  position:absolute;top:30px;left:30px;z-index:6;
  font-family:var(--f-li);font-size:30px;
  color:var(--c-paper);letter-spacing:0.2em;
  padding:8px 16px;
  background:rgba(177,58,47,0.85);
  border:2px solid var(--c-vermilion-deep);
  backdrop-filter:blur(2px);
}
.stage-overlay-tr{
  position:absolute;top:30px;right:30px;z-index:6;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
}
/* 亮照片上也要看得清：右上角加一层压暗衬底 */
.stage-overlay-tr::before{
  content:'';position:absolute;
  left:-28px;right:-28px;top:-30px;bottom:-20px;
  background:linear-gradient(180deg,rgba(20,16,12,0.72) 0%,rgba(20,16,12,0.34) 70%,rgba(20,16,12,0) 100%);
  z-index:-1;pointer-events:none;
}
.stage-overlay-tr .scene-num{
  font-family:var(--f-latin);font-size:13px;letter-spacing:0.4em;
  color:var(--c-gold);text-transform:uppercase;
}
.stage-overlay-tr .scene-en{
  font-family:var(--f-kai);font-size:15px;
  color:rgba(247,240,222,0.95);letter-spacing:0.24em;
  text-shadow:0 2px 12px rgba(0,0,0,0.9),0 0 4px rgba(0,0,0,0.8),0 0 14px rgba(0,0,0,0.6);
}

/* 底部场景信息（右侧留出「园林平面图」按钮的位置） */
.stage-info{
  position:absolute;left:86px;right:210px;bottom:30px;z-index:6;
  color:var(--c-paper);
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:30px;
}
.stage-info .text{flex:1;max-width:60%}
.stage-info .name{
  font-family:var(--f-li);font-size:54px;letter-spacing:0.12em;line-height:1;
  margin-bottom:10px;
}
.stage-info .verse{
  font-family:var(--f-kai);font-size:15px;letter-spacing:0.2em;line-height:1.7;
  color:rgba(243,234,181,0.9);
  border-left:2px solid var(--c-vermilion);padding-left:12px;
}
.stage-info .desc{
  flex:1;
  font-family:var(--f-kai);font-size:14px;line-height:1.95;
  color:rgba(243,234,181,0.85);
  background:rgba(20,16,12,0.5);
  padding:14px 18px;
  border-left:2px solid var(--c-gold);
  backdrop-filter:blur(4px);
  max-width:380px;
}

/* 步骤按钮 */
.step-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:56px;height:56px;
  background:rgba(243,234,181,0.9);
  color:var(--c-ink);
  border:2px solid var(--c-vermilion-deep);
  font-family:var(--f-latin);font-size:24px;
  cursor:pointer;z-index:7;
  display:flex;align-items:center;justify-content:center;
  transition:all .3s;
}
.step-btn:hover{background:var(--c-vermilion);color:var(--c-paper)}
.step-btn.prev{left:20px}
.step-btn.next{right:20px}

/* 景中之物：原热点圆点与照片对不上，改为右下方文字条 */
.stage-info .spots{
  margin-top:12px;padding-top:10px;
  border-top:1px dashed rgba(243,234,181,0.28);
}
.stage-info .spots:empty{display:none}
.stage-info .spot-item{
  display:flex;gap:10px;align-items:baseline;
  margin-top:6px;
  font-family:var(--f-kai);font-size:13px;line-height:1.75;
}
.stage-info .spot-name{
  font-family:var(--f-li);font-size:14px;
  color:var(--c-gold);letter-spacing:0.12em;white-space:nowrap;
}
.stage-info .spot-detail{color:rgba(243,234,181,0.82)}

/* 场景走廊 */
.scene-strip{
  margin-top:30px;
  background:var(--c-paper);
  border:1px solid rgba(31,26,20,0.3);
  padding:20px;
  position:relative;
}
.scene-strip::before{
  content:'';position:absolute;inset:5px;
  border:1px solid rgba(31,26,20,0.15);
  pointer-events:none;
}
.strip-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.3em;
  color:var(--c-ink-soft);
}
.strip-header .strip-title{color:var(--c-ink);font-family:var(--f-li);font-size:20px;letter-spacing:0.2em}
.strip-header .strip-hint{font-family:var(--f-kai);font-size:13px;letter-spacing:0.26em;color:var(--c-ink-soft)}

.scene-list{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:14px;
}
.scene-thumb{
  position:relative;
  aspect-ratio:4/3;
  background:#3a2f24;
  border:1px solid rgba(31,26,20,0.3);
  cursor:pointer;
  overflow:hidden;
  transition:all .4s;
}
.scene-thumb img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(0.85) contrast(1.05) sepia(0.12);
  opacity:0;
  transition:transform .8s, filter .4s, opacity .7s ease;
}
.scene-thumb img.loaded{opacity:1}
.scene-thumb:hover img{transform:scale(1.08);filter:saturate(0.95) contrast(1.05)}
.scene-thumb .thumb-name{
  position:absolute;left:0;right:0;bottom:0;
  padding:8px 10px;
  background:linear-gradient(180deg,transparent,rgba(20,16,12,0.85));
  color:var(--c-paper);
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.15em;
}
.scene-thumb .thumb-no{
  position:absolute;top:6px;left:6px;
  background:var(--c-paper);color:var(--c-ink);
  font-family:var(--f-latin);font-size:11px;letter-spacing:0.2em;
  padding:2px 6px;border:1px solid rgba(31,26,20,0.4);
}
.scene-thumb .visited-mark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-6deg);
  width:54px;height:54px;
  background:var(--c-vermilion);
  color:var(--c-paper);
  font-family:var(--f-li);font-size:14px;letter-spacing:0.1em;
  display:flex;align-items:center;justify-content:center;text-align:center;
  border:2px solid var(--c-vermilion-deep);
  opacity:0;transition:opacity .5s, transform .5s;
  pointer-events:none;
  z-index:2;
}
.scene-thumb.visited .visited-mark{
  opacity:0.92;transform:translate(-50%,-50%) rotate(-12deg);
}
.scene-thumb.visited img{filter:saturate(0.4) contrast(1) sepia(0.2)}
.scene-thumb.visited img.loaded{opacity:.65}
.scene-thumb.visited:hover img{filter:saturate(0.55) contrast(1.02) sepia(0.18)}
.scene-thumb.current{
  border-color:var(--c-vermilion);
  box-shadow:0 0 0 2px var(--c-vermilion), 0 8px 20px -6px rgba(177,58,47,0.5);
}

/* 园林平面图 */
.map-toggle{
  position:absolute;bottom:90px;right:30px;z-index:7;
  font-family:var(--f-kai);font-size:12px;letter-spacing:0.3em;
  padding:10px 16px;
  background:rgba(243,234,181,0.95);
  border:1px solid var(--c-ink);
  color:var(--c-ink);
  cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.map-toggle:hover{background:var(--c-vermilion);color:var(--c-paper);border-color:var(--c-vermilion-deep)}
.map-toggle::before{content:'◇'}

.map-modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(20,16,12,0.85);
  display:none;
  align-items:center;justify-content:center;
  backdrop-filter:blur(6px);
}
.map-modal.open{display:flex;animation:fadeIn .4s}
.map-modal .map-frame{
  position:relative;
  width:min(900px, 92vw);
  max-height:90vh;
  background:var(--c-paper);
  border:1px solid var(--c-ink);
  padding:40px;
  overflow:auto;
}
.map-modal .map-frame::before{
  content:'';position:absolute;inset:8px;
  border:1px solid rgba(31,26,20,0.2);
  pointer-events:none;
}
.map-modal h3{
  font-family:var(--f-li);font-size:32px;color:var(--c-ink);
  letter-spacing:0.2em;text-align:center;margin-bottom:6px;
}
.map-modal .map-py{
  font-family:var(--f-kai);font-size:15px;color:var(--c-daiqing-deep);
  letter-spacing:0.22em;text-align:center;margin-bottom:24px;
}
.map-modal .map-svg{width:100%;height:auto;display:block}
.map-modal .map-legend{
  margin-top:20px;
  display:flex;justify-content:center;gap:30px;
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.2em;
  color:var(--c-ink-soft);
}
.map-modal .map-legend span{display:inline-flex;align-items:center;gap:8px}
.map-modal .map-legend .dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.map-modal .map-close{
  position:absolute;top:16px;right:16px;
  width:40px;height:40px;
  background:var(--c-vermilion);color:var(--c-paper);
  border:2px solid var(--c-vermilion-deep);
  font-family:var(--f-li);font-size:20px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:5;
}

/* 完成弹窗 */
.complete-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(20,16,12,0.7);
  display:none;
  align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
.complete-overlay.open{display:flex;animation:fadeIn .5s}
.complete-seal{
  width:300px;height:300px;
  background:var(--c-vermilion);
  color:var(--c-paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-li);
  border:6px solid var(--c-vermilion-deep);
  box-shadow:0 0 0 6px rgba(177,58,47,0.3), 0 30px 60px rgba(0,0,0,0.5);
  transform:rotate(-3deg) scale(0);
  animation:stampIn 0.8s 0.2s cubic-bezier(0.2,1.4,0.4,1) forwards;
  position:relative;
}
.complete-seal::before{
  content:'';position:absolute;inset:8px;
  border:1px solid rgba(243,234,181,0.4);
}
.complete-seal .big{
  font-size:54px;letter-spacing:0.15em;line-height:1.1;text-align:center;
  margin-bottom:14px;
}
.complete-seal .small{
  font-size:20px;letter-spacing:0.4em;
  color:var(--c-gold);
}
@keyframes stampIn{
  0%{transform:rotate(-3deg) scale(2);opacity:0}
  50%{transform:rotate(-3deg) scale(0.9);opacity:1}
  75%{transform:rotate(-3deg) scale(1.05);opacity:1}
  100%{transform:rotate(-3deg) scale(1);opacity:1}
}
.complete-msg{
  position:absolute;
  bottom:80px;left:50%;transform:translateX(-50%);
  color:var(--c-paper);text-align:center;
  font-family:var(--f-kai);font-size:20px;letter-spacing:0.3em;
}
.complete-msg small{display:block;margin-top:8px;font-family:var(--f-kai);font-size:15px;color:var(--c-gold);letter-spacing:0.3em}
.complete-close{
  position:absolute;top:40px;right:40px;
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.3em;
  color:var(--c-paper);
  background:transparent;
  border:1px solid var(--c-paper);
  padding:10px 20px;cursor:pointer;
}

/* ==== 历史沿革 ==== */
.history{
  position:relative;z-index:3;
  padding:60px 0 80px;
  background:linear-gradient(180deg, transparent, rgba(232,222,195,0.5));
}
.history-grid{
  display:grid;grid-template-columns:1fr 1.2fr;gap:60px;
  max-width:1200px;margin:0 auto;padding:0 32px;
}
.history-text h3{
  font-family:var(--f-li);font-size:46px;color:var(--c-ink);
  letter-spacing:0.15em;line-height:1.1;margin-bottom:18px;
}
.history-text .lead{
  font-family:var(--f-kai);font-size:17px;
  color:var(--c-vermilion-deep);letter-spacing:0.3em;margin-bottom:24px;
}
.history-text p{
  font-family:var(--f-kai);font-size:15.5px;line-height:2.05;
  color:var(--c-ink-soft);
  text-indent:2em;
  margin-bottom:18px;
}

.timeline{
  position:relative;padding-left:36px;
}
.timeline::before{
  content:'';position:absolute;left:8px;top:0;bottom:0;
  width:2px;
  background:linear-gradient(180deg, var(--c-vermilion), var(--c-gold), var(--c-vermilion));
}
.timeline-item{
  position:relative;padding:14px 0 28px;
  cursor:default;
}
.timeline-item::before{
  content:'';position:absolute;left:-32px;top:18px;
  width:14px;height:14px;
  background:var(--c-vermilion);
  border:3px solid var(--c-paper);
  border-radius:50%;
  box-shadow:0 0 0 2px var(--c-vermilion);
}
.timeline-item .era{
  font-family:var(--f-li);font-size:22px;color:var(--c-vermilion-deep);
  letter-spacing:0.2em;display:block;margin-bottom:6px;
}
.timeline-item .event{
  font-family:var(--f-kai);font-size:14px;line-height:1.85;
  color:var(--c-ink-soft);
}

/* ==== 建筑之美 ==== */
.architecture{
  position:relative;z-index:3;
  padding:80px 0;
}
.arch-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  max-width:1300px;margin:0 auto;padding:0 32px;
}
.arch-card{
  position:relative;
  background:var(--c-paper);
  border:1px solid rgba(31,26,20,0.3);
  padding:30px 28px;
  overflow:hidden;
  isolation:isolate;
  transition:transform .4s, box-shadow .4s;
}
.arch-card::before{
  content:'';position:absolute;inset:6px;
  border:1px solid rgba(31,26,20,0.18);
  pointer-events:none;
}
.arch-card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 40px -10px rgba(31,26,20,0.25);
}
.arch-card .no{
  font-family:var(--f-ljmc);font-size:40px;font-weight:400;
  color:var(--c-vermilion);
  line-height:1;display:block;
  margin-bottom:14px;
}
/* 名景卡片配图：实景照片优先，SVG 水墨兜底 */
.arch-illu{
  position:relative;
  width:100%;height:132px;
  margin:0 0 18px;
  overflow:hidden;
  background:var(--c-paper2);
  border:1px solid rgba(31,26,20,0.18);
}
.arch-illu svg{display:block;width:100%;height:100%}
.arch-illu img{
  position:absolute!important;inset:0;width:100%!important;height:100%!important;
  object-fit:cover;z-index:2;
}
.arch-card h4{
  font-family:var(--f-li);font-size:28px;color:var(--c-ink);
  letter-spacing:0.1em;margin-bottom:4px;
}
.arch-card .tag{
  font-family:var(--f-kai);font-size:12px;letter-spacing:0.3em;
  color:var(--c-vermilion-deep);
  display:inline-block;margin-bottom:14px;
  border-bottom:1px solid var(--c-vermilion-deep);padding-bottom:4px;
}
.arch-card p{
  font-family:var(--f-kai);font-size:14px;line-height:1.95;
  color:var(--c-ink-soft);
}
.arch-card .seal-corner{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;
  background:var(--c-vermilion);
  color:var(--c-paper);
  font-family:var(--f-li);font-size:11px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--c-vermilion-deep);
  transform:rotate(-5deg);
  opacity:0.85;
}

/* ==== 名诗佳联 ==== */
.poetry{
  position:relative;z-index:3;
  padding:80px 0;
  background:
    radial-gradient(ellipse at center, rgba(20,52,66,0.96) 0%, rgba(10,30,38,1) 100%);
  color:var(--c-paper);
}
.poetry::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(177,58,47,0.15) 0%, transparent 30%),
    radial-gradient(circle at 80% 70%, rgba(181,141,78,0.12) 0%, transparent 30%);
  pointer-events:none;
}
.poem-list{
  max-width:1000px;margin:0 auto;padding:0 32px;
  display:flex;flex-direction:column;gap:60px;
}
.poem-item{
  text-align:center;position:relative;
}
.poem-item .quote-mark{
  font-family:var(--f-latin);font-size:120px;font-style:italic;
  color:var(--c-gold);opacity:0.4;
  line-height:1;display:block;
  margin-bottom:-30px;
}
.poem-item .poem-text{
  font-family:var(--f-ljmc);font-size:36px;
  letter-spacing:0.3em;line-height:2;
  color:var(--c-paper);
  margin-bottom:18px;
  text-shadow:0 2px 0 rgba(0,0,0,0.3);
}
.poem-item .poem-author{
  font-family:var(--f-kai);font-size:15px;
  color:var(--c-gold);letter-spacing:0.24em;
}
.poem-item .poem-author::before{content:'— ';opacity:0.5}
.poem-divider{
  display:flex;align-items:center;justify-content:center;gap:20px;
  color:var(--c-gold);opacity:0.5;
}
.poem-divider .bar{width:80px;height:1px;background:var(--c-gold)}
.poem-divider .diamond{width:6px;height:6px;background:var(--c-gold);transform:rotate(45deg)}

/* ==== 游览指南 ==== */
.visit{
  position:relative;z-index:3;
  padding:80px 0;
}
.visit-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
  max-width:1200px;margin:0 auto;padding:0 32px;
}
.visit-card{
  background:var(--c-paper);
  border:1px solid rgba(31,26,20,0.3);
  padding:24px 22px;
  text-align:center;
  position:relative;
}
.visit-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--c-vermilion);
}
.visit-card .icon{
  font-family:var(--f-li);font-size:36px;color:var(--c-vermilion-deep);
  margin-bottom:14px;display:block;
}
.visit-card .label{
  font-family:var(--f-kai);font-size:12px;letter-spacing:0.3em;
  color:var(--c-ink-soft);margin-bottom:8px;
}
.visit-card .value{
  font-family:var(--f-li);font-size:22px;letter-spacing:0.1em;
  color:var(--c-ink);margin-bottom:6px;
}
.visit-card .en{
  font-family:var(--f-kai);font-size:13px;
  color:var(--c-daiqing-deep);letter-spacing:0.24em;
}

/* ==== 其他园林 ==== */
.other-gardens{
  position:relative;z-index:3;
  padding:80px 0 60px;
  background:linear-gradient(180deg, transparent, rgba(232,222,195,0.4));
}
.other-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:18px;
  max-width:1300px;margin:0 auto;padding:0 32px;
}
.other-card{
  display:block;text-decoration:none;color:var(--c-ink);
  background:var(--c-paper);
  border:1px solid rgba(31,26,20,0.3);
  overflow:hidden;
  transition:transform .4s, box-shadow .4s;
}
.other-card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 30px -8px rgba(31,26,20,0.3);
}
.other-card .img{
  aspect-ratio:4/3;overflow:hidden;position:relative;
}
.other-card .img img{
  width:100%;height:100%;object-fit:cover;
  filter:saturate(0.75) contrast(1.08) sepia(0.1);
  transition:transform 1s, filter .6s;
}
.other-card:hover .img img{transform:scale(1.06);filter:saturate(1) contrast(1.05)}
.other-card .img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 50%,rgba(20,16,12,0.5));
}
.other-card .body{
  padding:18px 18px 20px;
  text-align:center;
}
.other-card .name{
  font-family:var(--f-li);font-size:22px;letter-spacing:0.15em;
  margin-bottom:4px;
}
.other-card .py{
  font-family:var(--f-kai);font-size:13px;
  color:var(--c-daiqing-deep);letter-spacing:0.22em;
  margin-bottom:10px;
}
.other-card .go{
  font-family:var(--f-kai);font-size:12px;letter-spacing:0.3em;
  color:var(--c-vermilion-deep);
}
.other-card:hover .go{color:var(--c-vermilion)}

/* ==== 页脚 ==== */
.foot{
  position:relative;z-index:3;
  background:#1a1410;color:var(--c-paper-2);
  padding:50px 0 30px;border-top:3px double var(--c-paper-3);
}
.foot-inner{
  max-width:1200px;margin:0 auto;padding:0 32px;
  display:flex;justify-content:space-between;align-items:center;
}
.foot-brand{
  font-family:var(--f-li);font-size:24px;letter-spacing:0.15em;
  color:var(--c-paper);
}
.foot-brand small{
  display:block;font-family:var(--f-kai);font-size:13px;
  letter-spacing:0.28em;color:var(--c-gold);
  margin-top:4px;
}
.foot-links{
  display:flex;gap:24px;
}
.foot-links a{
  font-family:var(--f-kai);font-size:13px;letter-spacing:0.2em;
  color:var(--c-paper-2);text-decoration:none;
  padding:6px 0;border-bottom:1px solid transparent;
}
.foot-links a:hover{color:var(--c-gold);border-color:var(--c-gold)}
.foot-credit{
  font-family:var(--f-kai);font-size:13px;
  letter-spacing:0.26em;color:rgba(243,234,181,0.5);
}

/* ==== 响应式 ==== */
@media (max-width:1100px){
  .hero-title{font-size:140px}
  .section-divider h2{font-size:54px}
  .top-nav .quick-nav a{font-size:12px;padding:0 8px;height:32px;letter-spacing:0}
  .arch-grid{grid-template-columns:repeat(2,1fr)}
  .other-grid{grid-template-columns:repeat(3,1fr)}
  .visit-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .top-nav{padding:12px 16px;flex-wrap:wrap;gap:10px}
  .top-nav .crumbs{display:none}
  .hero-title{font-size:88px}
  .hero-content{padding:0 30px 80px}
  .hero-verse{font-size:18px}
  .quick-grid{grid-template-columns:repeat(2,1fr);gap:24px 0}
  .quick-grid::before,.quick-grid::after{display:none}
  .section-divider h2{font-size:42px}
  .history-grid{grid-template-columns:1fr;gap:30px}
  .arch-grid{grid-template-columns:1fr}
  .other-grid{grid-template-columns:repeat(2,1fr)}
  .visit-grid{grid-template-columns:1fr}
  .stage{height:50vh;min-height:380px}
  .scene-list{grid-template-columns:repeat(3,1fr)}
  .scene-list .scene-thumb:nth-child(n+4){display:none}
  .stage-info{flex-direction:column;align-items:flex-start;gap:14px}
  .stage-info .text{max-width:100%}
  .stage-info .desc{max-width:100%}
  .stage-info .name{font-size:36px}
  /* 窄屏：信息区收紧，避免场景标题被左上印章压住 */
  .stage-info{left:74px;right:74px;gap:10px;bottom:22px}
  .stage-info .text{max-width:100%;background:rgba(20,16,12,0.62);padding:10px 14px;backdrop-filter:blur(4px);border-left:2px solid var(--c-gold)}
  .stage-info .name{font-size:30px;margin-bottom:6px}
  .stage-info .verse{font-size:12px;line-height:1.6;padding-left:9px}
  .stage-info .desc{font-size:12px;line-height:1.7;padding:10px 13px}
  .stage-info .spots{margin-top:8px;padding-top:7px}
  .stage-info .spot-item{font-size:11.5px;line-height:1.55;margin-top:4px;gap:8px}
  .stage-info .spot-name{font-size:12px}
  .stage-overlay-tl{top:16px;left:16px;font-size:22px;padding:5px 11px}
  .stage-overlay-tr{top:16px;right:16px}
  /* 窄屏：平面图按钮移到印章下方，避免压住说明框 */
  .map-toggle{top:62px;left:16px;right:auto;bottom:auto;padding:7px 12px;font-size:11px;letter-spacing:.2em}
  .step-btn{width:42px;height:42px;font-size:18px}
  .poem-item .poem-text{font-size:22px}
  .foot-inner{flex-direction:column;gap:20px;text-align:center}
}
@media (max-width:480px){
  .hero-title{font-size:60px}
  .other-grid{grid-template-columns:1fr}
  .scene-list{grid-template-columns:repeat(2,1fr)}
}

.fade-in{opacity:0;transform:translateY(20px);transition:opacity .9s, transform .9s}
.fade-in.in-view{opacity:1;transform:translateY(0)}

/* ==== SVG 插画容器 ==== */
.illu{position:relative;width:100%;height:100%;overflow:hidden}
.illu svg{display:block;width:100%;height:100%}
.other-card .img .illu{position:absolute;inset:0}
.other-card .img img{position:relative;z-index:-1}
.other-card .illu::after{
  content:'';position:absolute;inset:0;z-index:3;
  background:linear-gradient(180deg,transparent 50%,rgba(20,16,12,0.5));
}
.other-card .illu img{
  position:absolute!important;inset:0;width:100%!important;height:100%!important;
  object-fit:cover;z-index:2;
}
.illu > img{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover;z-index:2}
.svg-fallback{position:absolute;inset:0;z-index:1}

/* ============ 页面级装饰：回纹角隅 / 灯笼 / 团扇 / 印章 ============ */
.page-ornaments{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.corner{position:fixed;width:140px;height:140px;pointer-events:none;opacity:.42;transition:opacity .6s}
.corner.tl{top:42px;left:14px}
.corner.tr{top:42px;right:14px;transform:scaleX(-1)}
.corner.bl{bottom:42px;left:14px;transform:scaleY(-1)}
.corner.br{bottom:42px;right:14px;transform:scale(-1,-1)}
.corner:hover{opacity:.6}

const GARDEN_ORDER = ['zhuozheng','liu','wangshi','shizi','canglang','yi','yipu'];

/* ============ 渲染函数 ============ */
function getGardenFromUrl(){
  const params = new URLSearchParams(window.location.search);
  let id = params.get('id') || 'zhuozheng';
  if (!GARDENS[id]) id = 'zhuozheng';
  return id;
}

function renderGarden(id){
  const g = GARDENS[id];
  document.title = g.name + ' · 苏州园林志';
  
  const idx = GARDEN_ORDER.indexOf(id);
  const quickNav = GARDEN_ORDER.map((k, i) => 
    `<a href="garden.html?id=${k}" class="${k===id?'active':''}" title="${GARDENS[k].name}">${GARDENS[k].name.replace(/\s/g,'')}</a>`
  ).join('');
  document.getElementById('quick-nav').innerHTML = quickNav;
  document.getElementById('nav-cur').textContent = g.name.replace(/\s/g,'');
  
  const otherGardens = GARDEN_ORDER.filter(k => k !== id).map(k => {
    const og = GARDENS[k];
    const heroFn = k === 'zhuozheng' ? 'heroZhuozheng'
                : k === 'liu' ? 'heroLiu'
                : k === 'wangshi' ? 'heroWangshi'
                : k === 'shizi' ? 'heroShizi'
                : k === 'canglang' ? 'heroCanglang'
                : k === 'yi' ? 'heroYi' : 'heroZhuozheng';
    return `<a class="other-card" href="garden.html?id=${k}">
      <div class="img"><div class="illu" data-hero="${heroFn}" data-photo-key="card-${k}"></div></div>
      <div class="body">
        <div class="name">${og.name}</div>
        <div class="py">${og.alias}</div>
        <div class="go">入园 →</div>
      </div>
    </a>`;
  }).join('');
  
  // 名景卡片：能对上 walker 场景的复用同一张照片，一图两用
  const archCards = g.features.map((f, k) => {
    const si = g.scenes.findIndex(s => s.name.replace(/\s/g,'') === f.name.replace(/\s/g,''));
    const key = si >= 0 ? `${id}-scene-${si}` : `${id}-feature-${k}`;
    const fnName = illuForName(f.name) || HERO_FN[id] || 'heroZhuozheng';
    return `
    <div class="arch-card">
      <span class="seal-corner">园</span>
      <span class="no">${f.no}</span>
      <div class="arch-illu" data-arch-fn="${fnName}" data-photo-key="${key}"></div>
      <h4>${f.name}</h4>
      <span class="tag">${f.tag}</span>
      <p>${f.desc}</p>
    </div>
  `;
  }).join('');
  
  const timeline = g.history.map(h => `
    <div class="timeline-item">
      <span class="era">${h.era}</span>
      <span class="event">${h.event}</span>
    </div>
  `).join('');
  
  const poems = g.poems.map((p, i) => `
    <div class="poem-item">
      <span class="quote-mark">"</span>
      <div class="poem-text">${p.text}</div>
      <div class="poem-author">${p.author}</div>
      ${i < g.poems.length - 1 ? '<div class="poem-divider"><span class="bar"></span><span class="diamond"></span><span class="bar"></span></div>' : ''}
    </div>
  `).join('');
  
  document.getElementById('app').innerHTML = `
    <!-- HERO -->
    <section class="hero">
      <div class="hero-img" id="hero-img"></div>
      <div class="hero-frame"></div>
      <div class="hero-content">
        <div class="hero-eyebrow">${g.eyebrow}</div>

/* ============ 园林平面图 SVG 生成 ============ */
function generateMapSVG(g){
  const scenes = g.scenes;
  // 通用园林图：矩形围墙 + 水面 + 建筑 + 山石 + 标注
  let svg = '';
  
  // 外墙
  svg += `<rect x="20" y="20" width="760" height="460" fill="none" stroke="#3d3329" stroke-width="3" stroke-dasharray="2,4"/>`;
  svg += `<rect x="40" y="40" width="720" height="420" fill="none" stroke="#3d3329" stroke-width="1.5"/>`;
  
  // 入口
  svg += `<rect x="380" y="455" width="40" height="20" fill="#872821"/>`;
  svg += `<text x="400" y="495" text-anchor="middle" font-family="'Ma Shan Zheng',serif" font-size="14" fill="#1a1410">入</text>`;
  
  // 北侧
  svg += `<text x="400" y="32" text-anchor="middle" font-family="'Liu Jian Mao Cao',serif" font-size="14" fill="#3d3329" font-style="italic">— 北 —</text>`;
  
  // 通用水面（中心偏左）
  svg += `<path d="M 100 280 Q 180 240 280 250 T 480 290 Q 500 350 380 360 T 150 340 Z" 
    fill="#2f5a6e" opacity="0.3" stroke="#2f5a6e" stroke-width="1.5"/>`;
  svg += `<text x="220" y="320" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#2f5a6e" font-style="italic" opacity="0.7">彩 霞 池</text>`;
  
  // 山石区域（西部）
  svg += `<g opacity="0.6">
    <path d="M 80 130 L 110 100 L 140 130 L 130 160 L 90 160 Z" fill="#5a6b3a"/>
    <path d="M 140 110 L 170 80 L 200 110 L 190 145 L 150 145 Z" fill="#5a6b3a"/>
    <path d="M 200 130 L 230 100 L 260 130 L 250 165 L 210 165 Z" fill="#5a6b3a"/>
  </g>`;
  svg += `<text x="170" y="170" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#5a6b3a" opacity="0.7">假 山 区</text>`;
  
  // 建筑小图标
  function building(x, y, label){
    return `
      <g>
        <rect x="${x-20}" y="${y-12}" width="40" height="20" fill="#a66a3d" stroke="#1a1410" stroke-width="1"/>
        <polygon points="${x-24},${y-12} ${x},${y-22} ${x+24},${y-12}" fill="#872821" stroke="#1a1410" stroke-width="1"/>
        <text x="${x}" y="${y+30}" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#1a1410">${label}</text>
      </g>
    `;
  }
  
  // 场景点
  scenes.forEach((s, i) => {
    const x = 80 + (s.mapX / 100) * 640;
    const y = 60 + (s.mapY / 100) * 380;
    svg += `<g class="map-pt" data-idx="${i}">
      <circle cx="${x}" cy="${y}" r="22" fill="none" stroke="#b13a2f" stroke-width="1" opacity="0.3"/>
      <circle cx="${x}" cy="${y}" r="14" fill="#b13a2f" stroke="#872821" stroke-width="2" class="map-pt-dot" data-idx="${i}"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-family="'Ma Shan Zheng',serif" font-size="12" fill="#f3ead7">${['一','二','三','四','五','六'][i]}</text>
      <text x="${x}" y="${y-30}" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#1a1410" font-weight="500">${s.name.replace(/\s/g,'')}</text>
    </g>`;
  });
  
  return svg;
}

/* ============ 移步换景 游戏逻辑 ============ */
function setupWalker(g){
  const gardenId = GARDEN_ORDER.find(k => GARDENS[k] === g);
  let currentScene = 0;
  let visited = new Set();
  const stageBg = document.getElementById('stage-bg');
  const sceneList = document.getElementById('scene-list');
  const sceneName = document.getElementById('scene-name');
  const sceneVerse = document.getElementById('scene-verse');
  const sceneDesc = document.getElementById('scene-desc');
  const sceneSpots = document.getElementById('scene-spots');
  const sceneNo = document.getElementById('scene-no');
  const sceneEn = document.getElementById('scene-en');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const progressNum = document.getElementById('progress-num');
  const progressBar = document.getElementById('progress-bar');
  const resetBtn = document.getElementById('reset-btn');
  const mapBtn = document.getElementById('map-btn');
  const mapToggle = document.getElementById('map-toggle');
  const mapModal = document.getElementById('map-modal');
  const mapClose = document.getElementById('map-close');
  const completeOverlay = document.getElementById('complete-overlay');
  const completeClose = document.getElementById('complete-close');
  const stage = document.getElementById('stage');

  // 场景名 → 插画函数映射见顶层 SCENE_ILLU

  function getSceneIllu(name){
    return illuForName(name) || HERO_FN[gardenId] || 'heroZhuozheng';
  }

  // 照片到位后把 SVG 兜底层淡出：两层叠加时 SVG 可能压在照片之上
  window.dropIlluFallback = function(img){
    const fb = img && img.previousElementSibling;
    if (!fb || fb.className !== 'svg-fallback') return;
    fb.style.transition = 'opacity .8s ease';
    fb.style.opacity = '0';
    setTimeout(function(){ if (fb.parentNode) fb.remove(); }, 1000);
  };

  // 渲染场景缩略图（只建一次，之后只改状态类，避免换景时图片重载闪烁）
  function buildSceneList(){
    sceneList.innerHTML = g.scenes.map((s, i) => {
      const illuName = getSceneIllu(s.name);
      const svgFn = GP[illuName] || GP[HERO_FN[gardenId]] || GP.heroZhuozheng;
      const photoUrl = GP.photoFor(`${gardenId}-scene-${i}`);
      return `
      <div class="scene-thumb" data-idx="${i}">
        <div class="illu" data-thumb-idx="${i}">
          <div class="svg-fallback" style="position:absolute;inset:0;z-index:1">${svgFn()}</div>
          <img src="${photoUrl}" alt="${s.name}" loading="lazy"
               onload="this.classList.add('loaded');window.dropIlluFallback(this)" onerror="this.remove()">
        </div>
        <div class="thumb-no">${String(i+1).padStart(2,'0')}</div>
        <div class="thumb-name">${s.name}</div>
        <div class="visited-mark">已<br>游</div>
      </div>`;
    }).join('');
    sceneList.querySelectorAll('.scene-thumb').forEach(el => {
      el.addEventListener('click', () => goToScene(+el.dataset.idx));
    });
  }

  // 只更新缩略图状态：当前景高亮 + 已游章
  function updateSceneListState(){
    sceneList.querySelectorAll('.scene-thumb').forEach((el, i) => {
      el.classList.toggle('current', i === currentScene);
      el.classList.toggle('visited', visited.has(i));
    });
  }

  // 景中之物：原热点圆点的坐标对应平面图，与照片对不上，改为文字条
  function renderSpots(scene){
    if (!scene.hotspots || scene.hotspots.length === 0){
      sceneSpots.innerHTML = '';
      return;
    }
    sceneSpots.innerHTML = scene.hotspots.map(h => `
      <div class="spot-item">
        <span class="spot-name">${h.name}</span>
        <span class="spot-detail">${h.detail}</span>
      </div>
    `).join('');
  }

  // 舞台铺图：实景照片在上，SVG 兜底在下
  function fillStage(scene, idx){
    const illuName = getSceneIllu(scene.name);
    const svgFn = GP[illuName] || GP[HERO_FN[gardenId]] || GP.heroZhuozheng;
    const photoUrl = GP.photoFor(`${gardenId}-scene-${idx}`);
    stageBg.innerHTML = '';
    // SVG 兜底层
    const svgWrap = document.createElement('div');
    svgWrap.style.cssText = 'position:absolute;inset:0;z-index:1';
    svgWrap.innerHTML = svgFn();
    stageBg.appendChild(svgWrap);
    // 实景照片上层（本地就位后淡入）
    const img = new Image();
    img.alt = scene.name;
    img.loading = 'eager';
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;filter:saturate(0.9) contrast(1.05) sepia(0.08);opacity:0;transition:opacity .8s ease';
    img.onload = function(){
      const self = this;
      self.style.opacity = '1';
      // 兜底层同步淡出，避免两层叠加
      svgWrap.style.transition = 'opacity .8s ease';
      svgWrap.style.opacity = '0';
      setTimeout(function(){ if (svgWrap.parentNode) svgWrap.remove(); }, 1000);
    };
    img.onerror = function(){ this.remove(); };
    img.src = photoUrl;
    stageBg.appendChild(img);
  }

  // 显示一景：画面与文字同步
  function showScene(scene, idx){
    fillStage(scene, idx);
    // 容器立即复位：新画面自身做淡入（SVG 底 → 照片）
    stageBg.style.transition = 'none';
    stageBg.style.opacity = '1';
    void stageBg.offsetWidth;        // 强制回流，让「无过渡」生效
    stageBg.style.transition = '';
    sceneName.textContent = scene.name;
    sceneVerse.textContent = scene.verse;
    sceneDesc.textContent = scene.desc;
    sceneNo.textContent = `0${idx+1} / 0${g.scenes.length}`;
    sceneEn.textContent = scene.alias;
    // 左上印章保持园林名（与下方场景标题不再重复）
    renderSpots(scene);
  }

  // 落章：盖在当前画面上，照片全程留在屏上
  let liveStamp = null;
  function stampSeal(){
    if (liveStamp && liveStamp.parentNode) liveStamp.remove();
    const stamp = document.createElement('div');
    stamp.className = 'stamp-flash';
    stamp.textContent = '游';
    stage.appendChild(stamp);
    liveStamp = stamp;
    return stamp;
  }

  // 章随画面一同淡出
  function fadeStamp(stamp){
    if (!stamp || !stamp.parentNode) return;
    stamp.style.animation = 'none';
    stamp.style.opacity = '0';
    setTimeout(() => {
      if (stamp.parentNode) stamp.remove();
      if (liveStamp === stamp) liveStamp = null;
    }, 500);
  }

  // 切换场景
  let swapToken = 0;
  function goToScene(idx, direction = 'next', initial = false, allowStamp = true){
    if (idx < 0) idx = g.scenes.length - 1;
    if (idx >= g.scenes.length) idx = 0;
    const scene = g.scenes[idx];
    const leaving = currentScene;     // 即将离开的一景
    currentScene = idx;

    // 离景盖章：这一景看完才算「已游」，章落在旧画面上，此时照片不消失
    let stamp = null;
    const sealLeaving = allowStamp && !initial && leaving !== idx && !visited.has(leaving);
    if (sealLeaving){
      visited.add(leaving);
      stamp = stampSeal();
    }

    const myToken = ++swapToken;
    if (initial){
      showScene(scene, idx);           // 首景直接铺图
    } else {
      // 章落定后，画面才淡出换图
      const hold = sealLeaving ? 850 : 0;
      setTimeout(() => {
        if (myToken !== swapToken) return;   // 连续点击时只认最后一次
        fadeStamp(stamp);
        stageBg.style.opacity = '0';           // 淡出旧画面
        setTimeout(() => {
          if (myToken !== swapToken) return;
          showScene(scene, idx);               // 换上新画面
        }, 450);
      }, hold);
    }

    updateSceneListState();
    updateProgress();

    // 地图点更新
    document.querySelectorAll('.map-pt-dot').forEach((d, i) => {
      d.setAttribute('r', i === idx ? '20' : '14');
      d.setAttribute('fill', i === idx ? '#b13a2f' : (visited.has(i) ? '#872821' : '#b13a2f'));
    });
  }
  
  // 完成弹窗延迟开启：重游时须撤销，避免清零后又弹出
  let completeTimer = null;
  function updateProgress(){
    progressNum.textContent = visited.size;
    const pct = (visited.size / g.scenes.length) * 100;
    progressBar.style.setProperty('--progress', pct + '%');

    // 完成检测
    if (visited.size === g.scenes.length){
      clearTimeout(completeTimer);
      completeTimer = setTimeout(() => {
        completeOverlay.classList.add('open');
      }, 1200);
    }
  }
  
  prevBtn.addEventListener('click', () => goToScene(currentScene - 1, 'prev'));
  nextBtn.addEventListener('click', () => goToScene(currentScene + 1, 'next'));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goToScene(currentScene - 1);
    if (e.key === 'ArrowRight') goToScene(currentScene + 1);
  });
  
  resetBtn.addEventListener('click', () => {
    visited.clear();                        // 清空所有「已游」章
    clearTimeout(completeTimer);
    completeOverlay.classList.remove('open');
    goToScene(0, 'next', false, false);     // 回到首景，重游不盖章
  });
  
  // 地图开关
  function openMap(){ mapModal.classList.add('open'); }
  function closeMap(){ mapModal.classList.remove('open'); }
  mapBtn.addEventListener('click', openMap);
  mapToggle.addEventListener('click', openMap);
  mapClose.addEventListener('click', closeMap);
  mapModal.addEventListener('click', (e) => { if (e.target === mapModal) closeMap(); });
  
  // 地图点点击
  document.querySelectorAll('.map-pt').forEach(pt => {
    pt.addEventListener('click', () => {
      closeMap();
      goToScene(+pt.dataset.idx);
    });
    pt.style.cursor = 'pointer';
  });
  
  completeClose.addEventListener('click', () => completeOverlay.classList.remove('open'));
  
  // 初始化（首景直接铺图，不盖章）
  buildSceneList();
  goToScene(0, 'next', true);
}

/* ============ 入场观察 ============ */
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('in-view');
      io.unobserve(e.target);
    }
  });
}, { threshold: 0.15 });

/* ============ 水墨涟漪（与首页一致） ============ */
const canvas = document.getElementById('ripple-canvas');
const ctx = canvas.getContext('2d');
let ripples = [];
let mouseX = -1000, mouseY = -1000;
let lastDrop = 0;

function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Ripple {
  constructor(x, y, power = 1){
    this.x = x; this.y = y;
    this.radius = 3;
    this.maxRadius = (150 + Math.random() * 110) * power;
    this.speed = (0.46 + Math.random() * 0.3) * (0.9 + power * 0.18);
    this.life = 1;
    this.decay = (0.0038 + Math.random() * 0.0016) / power;
    this.wobble = Math.random() * Math.PI * 2;
    this.spin = 0.004 + Math.random() * 0.007;
    this.ink = 0.72 + Math.random() * 0.28;
  }
  update(){
    this.radius += this.speed;
    this.wobble += this.spin;
    this.life -= this.decay;
    if (this.radius > this.maxRadius) this.life = 0;
  }
  draw(){
    if (this.life <= 0) return;
    const { x, y, radius, life, wobble } = this;
    // 二次衰减：墨痕收尾更柔
    const fade = life * life * this.ink;
    if (fade <= 0.003) return;
    const R = Math.max(0.5, radius + Math.sin(wobble) * 2.2);
    const k = 0.93 + Math.sin(wobble * 0.63) * 0.06;  // 略扁，像手绘水波
    const ry = R * k;

    // 外层水墨晕：边缘完全化开
    const halo = ctx.createRadialGradient(x, y, R * 0.5, x, y, R * 1.05);
    halo.addColorStop(0, 'rgba(31,26,20,0)');
    halo.addColorStop(0.70, `rgba(31,26,20,${0.045 * fade})`);
    halo.addColorStop(0.93, `rgba(31,26,20,${0.12 * fade})`);
    halo.addColorStop(1, 'rgba(31,26,20,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.ellipse(x, y, R * 1.05, ry * 1.05, 0, 0, Math.PI * 2);
    ctx.fill();

    // 三道由浓到淡的水波线，扩散越远越细
    const rings = [[1, 0.19, 1.1], [0.78, 0.125, 0.9], [0.54, 0.065, 0.7]];
    for (const r of rings){
      const rr = Math.max(0.4, R * r[0]);
      ctx.strokeStyle = `rgba(31,26,20,${r[1] * fade})`;
      ctx.lineWidth = r[2];
      ctx.beginPath();
      ctx.ellipse(x, y, rr, rr * k, wobble * 0.06, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 落笔处的淡墨点，随扩散很快化开
    const dot = Math.max(0, 1 - radius / 44);
    if (dot > 0.02){
      const dr = Math.max(0.4, radius * 0.85 + 2);
      const g = ctx.createRadialGradient(x, y, 0, x, y, dr);
      g.addColorStop(0, `rgba(31,26,20,${0.26 * fade * dot})`);
      g.addColorStop(1, 'rgba(31,26,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, dr, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// 落墨：慢、疏、克制
function dropInk(x, y, power){
  ripples.push(new Ripple(x, y, power));
  while (ripples.length > 8) ripples.shift();
}

window.addEventListener('mousemove', e => {
  const moved = Math.hypot(e.clientX - mouseX, e.clientY - mouseY);
  mouseX = e.clientX; mouseY = e.clientY;
  const now = performance.now();
  // 至少移动 26px 且间隔 240ms 才落一滴：比原来慢得多、稀得多
  if (moved > 26 && now - lastDrop > 240){
    lastDrop = now;
    dropInk(mouseX, mouseY, 1);
  }
});

window.addEventListener('touchmove', e => {
  if (!e.touches[0]) return;
  const t = e.touches[0];
  const moved = Math.hypot(t.clientX - mouseX, t.clientY - mouseY);
  mouseX = t.clientX; mouseY = t.clientY;
  const now = performance.now();
  if (moved > 26 && now - lastDrop > 240){
    lastDrop = now;
    dropInk(mouseX, mouseY, 1);
  }
}, { passive:true });

// 点击 = 滴墨入纸：晕得更慢、更浓
window.addEventListener('mousedown', e => { dropInk(e.clientX, e.clientY, 1.9); });

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ripples.forEach(r => { r.update(); r.draw(); });
  ripples = ripples.filter(r => r.life > 0);
  requestAnimationFrame(animate);
}
animate();

/* ============ 启动 ============ */
const id = getGardenFromUrl();
renderGarden(id);

/* ============ 渲染所有 SVG 插画（实景照片 + SVG 兜底） ============ */
(function(){
  if (!window.GP) return;

  function renderPhotoWithSvg(el, photoUrl, svgFn, focus){
    el.innerHTML = '';
    const svgWrap = document.createElement('div');
    svgWrap.className = 'svg-fallback';
    svgWrap.style.cssText = 'position:absolute;inset:0;z-index:1';
    if (svgFn) svgWrap.innerHTML = svgFn();
    el.appendChild(svgWrap);
    const img = new Image();
    img.alt = el.dataset.alt || '';
    img.loading = 'lazy';
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;opacity:0;transition:opacity .8s ease'
      + (focus ? ';object-position:' + focus : '');
    img.onload = function(){
      const self = this;
      self.style.opacity = '1';
      // 兜底层同步淡出，避免两层叠加时 SVG 压在照片之上
      svgWrap.style.transition = 'opacity .8s ease';
      svgWrap.style.opacity = '0';
      setTimeout(function(){ if (svgWrap.parentNode) svgWrap.remove(); }, 1000);
    };
    img.onerror = function(){ this.remove(); }; // 照片缺失则保留 SVG 兜底
    img.src = photoUrl;
    el.appendChild(img);
  }

  // Hero 大图
  const heroEl = document.getElementById('hero-img');
  const heroFn = GP[HERO_FN[id]];
  if (heroEl && heroFn){
    renderPhotoWithSvg(heroEl, GP.photoFor(id + '-hero'), heroFn, GARDENS[id].heroFocus);
  }

  // 其他园林插画（5 张）—— 复用首页卡片照片 card-{gardenId}.jpg
  document.querySelectorAll('[data-hero]').forEach(el => {
    const fn = GP[el.dataset.hero];
    const key = el.dataset.photoKey || 'card-zhuozheng';
    if (fn) renderPhotoWithSvg(el, GP.photoFor(key), fn);
  });

  // 名景卡片配图：与 walker 场景共用同一张照片
  document.querySelectorAll('[data-arch-fn]').forEach(el => {
    // 插画函数缺失时退回本园主图插画，避免出现空白框
    const fn = GP[el.dataset.archFn] || GP[HERO_FN[id]] || GP.heroZhuozheng;
    const key = el.dataset.photoKey;
    if (key) renderPhotoWithSvg(el, GP.photoFor(key), fn);
  });
})();

/* ============ 入场动画 ============ */
window.addEventListener('load', () => {
  document.querySelectorAll('.fade-in').forEach(el => io.observe(el));
});
</script>
