<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>苏州园林志 · 启动</title>
<meta name="description" content="启动页与引导页 · 品牌化加载动画与三步入园引导">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@200;300;400;500;600;700;900&family=Liu+Jian+Mao+Cao&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .8s var(--ease-soft),transform .8s var(--ease-move)}
.splash.is-out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash__inner{text-align:center;position:relative;z-index:2;padding:24px}
.splash__mark{width:96px;height:96px;margin:0 auto 26px;position:relative}
.splash__mark svg{width:100%;height:100%}
.splash__seal{
  position:absolute;right:-14px;bottom:-10px;width:42px;height:42px;border-radius:50%;
  background:var(--primary);color:var(--text-inv);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-li);font-size:15px;box-shadow:0 0 0 2px var(--primary-deep);
  opacity:0;transform:scale(1.6) rotate(-20deg);
}
.splash.is-stamped .splash__seal{animation:gpStamp .72s var(--ease-seal) forwards}
.splash__title{font-family:var(--f-li);font-size:clamp(38px,7vw,62px);letter-spacing:.22em;color:var(--c-ink);line-height:1.2}
.splash__en{font-family:var(--f-latin);font-size:13px;letter-spacing:.42em;color:var(--text-4);margin-top:12px;text-transform:uppercase}
.splash__bar{width:min(280px,64vw);height:3px;background:var(--surface-3);border-radius:2px;margin:34px auto 12px;overflow:hidden}
.splash__fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--c-gold));transition:width .28s linear}
.splash__tip{font-family:var(--f-kai);font-size:12.5px;letter-spacing:.24em;color:var(--text-3)}
.splash__ring{position:absolute;border:1px solid rgba(177,58,47,.16);border-radius:50%;animation:gpBreath 4s ease-in-out infinite}
.splash__ring.r1{width:340px;height:340px;top:50%;left:50%;margin:-170px 0 0 -170px}
.splash__ring.r2{width:480px;height:480px;top:50%;left:50%;margin:-240px 0 0 -240px;animation-delay:.6s}
.splash__ring.r3{width:640px;height:640px;top:50%;left:50%;margin:-320px 0 0 -320px;animation-delay:1.2s}

/* 引导页 */
.onb{position:fixed;inset:0;z-index:190;background:var(--bg);display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .6s var(--ease-soft),visibility .6s}
.onb.is-on{opacity:1;visibility:visible}
.onb__card{width:min(760px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r-md);box-shadow:var(--sh-3);overflow:hidden;position:relative}
.onb__art{height:330px;background:linear-gradient(160deg,var(--surface-2),var(--surface-3));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.onb__art svg{width:78%;height:auto}
.onb__body{padding:32px 38px 30px;position:relative}
.onb__txt{position:relative;min-height:172px}
.onb__no{font-family:var(--f-latin);font-size:14px;letter-spacing:.3em;color:var(--primary)}
.onb__t{font-family:var(--f-li);font-size:30px;letter-spacing:.12em;color:var(--c-ink);margin:6px 0 12px}
.onb__d{font-family:var(--f-qkhy);font-size:15px;line-height:2;color:var(--text-2)}
.onb__dots{display:flex;gap:8px;margin-top:22px}
.onb__dot{width:26px;height:3px;border-radius:2px;background:var(--border-strong);cursor:pointer;transition:background var(--t-base),width var(--t-base)}
.onb__dot.is-on{background:var(--primary);width:38px}
.onb__foot{display:flex;align-items:center;gap:12px;margin-top:24px}
.onb__skip{margin-left:auto;font-family:var(--f-kai);font-size:13px;letter-spacing:.16em;color:var(--text-4);background:none;border:0;cursor:pointer}
.onb__skip:hover{color:var(--primary)}
.onb__stage{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(34px);transition:all .5s var(--ease-move)}
.onb__stage.is-on{opacity:1;visibility:visible;transform:none}
.onb__stage.is-left{transform:translateX(-34px)}
@media (max-width:768px){ .onb__art{height:230px} .onb__body{padding:24px 22px} .onb__t{font-size:24px} }
</style>
</head>
<body class="gp-paper">

<!-- ============ 启动页 ============ -->
<section class="splash" id="splash">
  <span class="splash__ring r1"></span><span class="splash__ring r2"></span><span class="splash__ring r3"></span>
  <div class="splash__inner">
    <div class="splash__mark">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="92" height="92" rx="5" stroke="#b13a2f" stroke-width="2.4"/>
        <path d="M16 70 q16-11 34-5 t34-5" stroke="#1a1410" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M14 54 h72" stroke="#1a1410" stroke-width="1.5" opacity=".5"/>
        <path d="M28 40 L50 16 L72 40" stroke="#2f5a6e" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M34 40 v18 M66 40 v18" stroke="#2f5a6e" stroke-width="1.6"/>
        <circle cx="50" cy="34" r="3" fill="#b58d4e"/>
      </svg>
      <span class="splash__seal">苏</span>
    </div>
    <h1 class="splash__title">咫 尺 乾 坤</h1>
    <div class="splash__en">Suzhou Gardens Archive</div>
    <div class="splash__bar"><div class="splash__fill" data-gp-progress></div></div>
    <div class="splash__tip" data-gp-tip>展 卷 · 泼 墨</div>
  </div>
</section>

<!-- ============ 引导页 ============ -->
<section class="onb" id="onb">
  <div class="onb__card">
    <div class="onb__art">
      <!-- 阶段 1 -->
      <div class="onb__stage is-on" data-stage="0">
        <svg viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 210 q120-40 250-18 t230-30" stroke="#bfae8a" stroke-width="2" stroke-linecap="round"/>
          <path d="M40 226 q140-34 260-10 t190-26" stroke="#ddd0ad" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M120 180 q30-70 60-92 q34 24 62 96" fill="#e6d9ba" stroke="#5a4d3d" stroke-width="1.6"/>
          <path d="M150 96 l30-42 30 42" stroke="#2f5a6e" stroke-width="2" fill="#c9b896"/>
          <path d="M300 186 v-64 l34-26 34 26 v64 z" fill="#efe4cb" stroke="#5a4d3d" stroke-width="1.6"/>
          <path d="M334 96 l0-24 M318 72 h32" stroke="#b13a2f" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="430" cy="170" r="34" stroke="#2f5a6e" stroke-width="1.4" opacity=".6"/>
          <circle cx="430" cy="170" r="22" stroke="#2f5a6e" stroke-width="1" opacity=".4"/>
          <rect x="60" y="150" width="26" height="26" rx="2" fill="#b13a2f"/>
          <text x="73" y="168" text-anchor="middle" font-family="serif" font-size="15" fill="#f3ead7">苏</text>
        </svg>
      </div>
      <!-- 阶段 2 -->
      <div class="onb__stage" data-stage="1">
        <svg viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="60" y="40" width="180" height="180" rx="6" fill="#f8f2e1" stroke="#bfae8a" stroke-width="1.6"/>
          <path d="M84 78 h132 M84 108 h132 M84 138 h90" stroke="#c9b896" stroke-width="4" stroke-linecap="round"/>
          <rect x="290" y="40" width="180" height="180" rx="6" fill="#f8f2e1" stroke="#b13a2f" stroke-width="1.6"/>
          <path d="M314 96 h132 M314 126 h132 M314 156 h72" stroke="#b13a2f" stroke-width="4" stroke-linecap="round" opacity=".55"/>
          <rect x="206" y="96" width="108" height="68" rx="4" fill="#b13a2f" opacity=".9"/>
          <text x="260" y="138" text-anchor="middle" font-family="serif" font-size="24" fill="#f3ead7">搜</text>
          <path d="M150 250 q40-14 80 0 t80 0" stroke="#ddd0ad" stroke-width="2"/>
        </svg>
      </div>
      <!-- 阶段 3 -->
      <div class="onb__stage" data-stage="2">
        <svg viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="260" cy="128" r="86" stroke="#bfae8a" stroke-width="1.6" stroke-dasharray="6 7"/>
          <path d="M196 128 q30-52 64-52 t64 52" stroke="#2f5a6e" stroke-width="2"/>
          <path d="M196 128 q30 52 64 52 t64-52" stroke="#b58d4e" stroke-width="2"/>
          <circle cx="260" cy="128" r="14" fill="#b13a2f"/>
          <circle cx="196" cy="128" r="7" fill="#2f5a6e"/>
          <circle cx="324" cy="128" r="7" fill="#b58d4e"/>
          <path d="M110 96 q30-18 60 0" stroke="#8a7d6a" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
          <path d="M350 160 q30-18 60 0" stroke="#8a7d6a" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
        </svg>
      </div>
    </div>
    <div class="onb__body">
      <div class="onb__txt">
      <div class="onb__stage is-on" data-stage="0">
        <div class="onb__no">STEP 01 / 03</div>
        <h2 class="onb__t">展 卷 而 入 园</h2>
        <p class="onb__d">七座苏州古典园林，四百余年营建史。此处以图文与声音的数字化方式重现园林的秩序、气质与游观节奏。</p>
      </div>
      <div class="onb__stage" data-stage="1">
        <div class="onb__no">STEP 02 / 03</div>
        <h2 class="onb__t">按 心 而 寻 园</h2>
        <p class="onb__d">可按年代、体裁、造园手法检索，或直接以园名、名景、题咏为关键词搜索。筛选条件可随时叠加，一次比出高下。</p>
      </div>
      <div class="onb__stage" data-stage="2">
        <div class="onb__no">STEP 03 / 03</div>
        <h2 class="onb__t">移 步 而 换 景</h2>
        <p class="onb__d">详情页给出信息层级与阅读动线，沉浸场景页以热点导览引你穿行。收藏与题咏会留在"我的笺囊"，等你下次再来。</p>
      </div>
      </div>
      <div class="onb__dots" id="onbDots">
        <span class="onb__dot is-on" data-i="0"></span><span class="onb__dot" data-i="1"></span><span class="onb__dot" data-i="2"></span>
      </div>
      <div class="onb__foot">
        <button class="gp-btn gp-btn--ghost gp-btn--sm" id="onbPrev">上 一 步</button>
        <button class="gp-btn gp-btn--primary" id="onbNext">下 一 步</button>
        <button class="onb__skip" id="onbSkip">跳 过 直 达 园 志</button>
      </div>
    </div>
  </div>
</section>

<script src="app.js"></script>
<script>
(function(){
  const splash = document.getElementById('splash');
  const onb = document.getElementById('onb');

  /* 启动动画：进度条 + 印章落款 */
  let p = 0, i = 0;
  const tips = ['展 卷 · 泼 墨','理 水 · 叠 山','点 景 · 借 景','移 步 · 换 景'];
  const fill = document.querySelector('[data-gp-progress]');
  const tip = document.querySelector('[data-gp-tip]');
  const timer = setInterval(() => {
    p = Math.min(100, p + Math.random()*13 + 5);
    fill.style.width = p + '%';
    tip.textContent = tips[Math.min(tips.length-1, Math.floor(p/26))];
    if (p >= 100) {
      clearInterval(timer);
      splash.classList.add('is-stamped');
      setTimeout(() => {
        splash.classList.add('is-out');
        onb.classList.add('is-on');
      }, 720);
    }
  }, 200);

  /* 引导页翻页 */
  let stage = 0;
  const stages = Array.from(document.querySelectorAll('[data-stage]'));
  const dots = Array.from(document.querySelectorAll('.onb__dot'));
  function show(n){
    stage = Math.max(0, Math.min(2, n));
    stages.forEach(s => {
      const idx = +s.dataset.stage;
      s.classList.toggle('is-on', idx === stage);
      s.classList.toggle('is-left', idx < stage);
    });
    dots.forEach(d => d.classList.toggle('is-on', +d.dataset.i === stage));
    document.getElementById('onbPrev').style.visibility = stage === 0 ? 'hidden' : 'visible';
    document.getElementById('onbNext').textContent = stage === 2 ? '入 园 寻 幽' : '下 一 步';
  }
  document.getElementById('onbNext').addEventListener('click', () => {
    if (stage === 2) { location.href = 'index.html'; return; }
    show(stage + 1);
  });
  document.getElementById('onbPrev').addEventListener('click', () => show(stage - 1));
  document.getElementById('onbSkip').addEventListener('click', () => { location.href = 'index.html'; });
  dots.forEach(d => d.addEventListener('click', () => show(+d.dataset.i)));
  show(0);

  /* 键盘：← → 翻页 */
  document.addEventListener('keydown', e => {
    if (!onb.classList.contains('is-on')) return;
    if (e.key === 'ArrowRight') show(stage + 1);
    if (e.key === 'ArrowLeft') show(stage - 1);
  });
})();
</script>
</body>
</html>
